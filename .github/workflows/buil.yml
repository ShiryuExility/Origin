name: Build WASM

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-extract engine zip
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            echo "Source sudah ada, extract dilewati."
            exit 0
          fi
          if [[ -f auto-extract.sh ]]; then
            bash auto-extract.sh
            exit 0
          fi
          zip=""
          if [[ -f cinder-engine.zip ]]; then
            zip="cinder-engine.zip"
          else
            zip="$(find . -maxdepth 3 -type f -name '*.zip' ! -path '*/.git/*' | head -n 1 || true)"
          fi
          if [[ -z "${zip}" ]]; then
            echo "Tidak ada CMakeLists.txt dan tidak ada zip."
            exit 1
          fi
          echo "Extract: ${zip}"
          work="$(mktemp -d)"
          unzip -o "${zip}" -d "${work}"
          src="${work}"
          if [[ ! -f "${src}/CMakeLists.txt" ]]; then
            list="$(find "${src}" -name CMakeLists.txt | head -n 1)"
            if [[ -z "${list}" ]]; then
              echo "CMakeLists.txt tidak ketemu di dalam zip."
              exit 1
            fi
            src="$(dirname "${list}")"
          fi
          cp -a "${src}/." .
          rm -rf "${work}"
          test -f CMakeLists.txt
          echo "Extract selesai."

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.74-ubuntu

      - name: Setup Emscripten
        run: |
          set -euo pipefail
          if [[ ! -x emsdk/emsdk ]]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 3.1.74
          ./emsdk activate 3.1.74

      - name: Compile WASM
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./emsdk/emsdk_env.sh
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: cinder-wasm
          if-no-files-found: error
          path: |
            build/cinder.html
            build/cinder.js
            build/cinder.wasm
            
